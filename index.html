<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5fbf8">
  <meta name="description" content="Power Ranger Bot — démo de pairing WhatsApp.">
  <title>Power Ranger Bot — Démo</title>
  <style>
    :root{--ink:#15251f;--muted:#75877f;--green:#12a96c;--line:#dcebe3;--white:#fff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:#f5fbf8;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:28px 18px;position:relative}
    body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(2px)}body:before{width:460px;height:460px;top:-170px;left:-140px;background:radial-gradient(circle,rgba(56,232,159,.28),rgba(56,232,159,0) 68%)}body:after{width:520px;height:520px;right:-190px;bottom:-220px;background:radial-gradient(circle,rgba(100,161,255,.22),rgba(190,132,255,.10) 35%,transparent 70%)}
    .glow{position:fixed;z-index:-1;pointer-events:none;width:360px;height:200px;left:50%;top:35%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(46,220,145,.13),transparent 70%);filter:blur(18px)}
    main{width:min(100%,465px);text-align:center;position:relative}.cover{width:min(100%,340px);aspect-ratio:3/2;object-fit:cover;display:block;margin:0 auto 22px;border-radius:25px;box-shadow:0 18px 50px rgba(28,112,78,.14);border:1px solid rgba(255,255,255,.9)}
    .demo{display:inline-flex;align-items:center;gap:7px;background:#e6f8ef;border:1px solid #caefdb;color:#128050;border-radius:999px;padding:7px 12px;text-transform:uppercase;letter-spacing:1.5px;font-size:10px;font-weight:800}.demo i{width:7px;height:7px;border-radius:50%;background:#19bf78;box-shadow:0 0 11px rgba(25,191,120,.55)}
    h1{margin:13px 0 7px;font-size:clamp(30px,8vw,43px);letter-spacing:-1.5px;line-height:1.05;font-weight:850}.sub{margin:0 auto 25px;color:var(--muted);font-size:14px}
    .panel{background:rgba(255,255,255,.79);backdrop-filter:blur(14px);border:1px solid rgba(217,234,225,.9);border-radius:19px;padding:20px;text-align:left;box-shadow:0 16px 50px rgba(22,65,46,.07)}label{display:block;margin:0 0 8px 2px;font-size:12px;font-weight:750;color:#43594e}.row{display:flex;gap:9px}input{min-width:0;flex:1;height:48px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:0 13px;color:var(--ink);font:inherit;font-size:14px;outline:none}input:focus{border-color:#42c78d;box-shadow:0 0 0 3px rgba(18,169,108,.1)}button{height:48px;padding:0 16px;border:0;border-radius:11px;background:#122b21;color:white;font:700 13px inherit;font-weight:750;white-space:nowrap;cursor:pointer;box-shadow:0 5px 15px rgba(18,43,33,.13);transition:.18s}button:hover{background:#174b35;transform:translateY(-1px)}button:disabled{opacity:.6;cursor:wait}.result{display:none;margin-top:13px;padding:12px 13px;border:1px solid #dcebe3;background:#f4fbf7;border-radius:11px;color:#52685d;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.result.show{display:block}.code{display:block;margin-top:5px;color:#087b4b;font:bold 22px ui-monospace,monospace;letter-spacing:5px}.foot{margin-top:17px;color:#91a198;font-size:10px;letter-spacing:.2px}
    @media(max-width:420px){.cover{width:min(100%,310px);border-radius:21px}.panel{padding:16px}.row{flex-direction:column}button{width:100%}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body><div class="glow" aria-hidden="true"></div>
  <main>
    <img class="cover" src="power-ranger-cover.png" alt="Illustration futuriste lumineuse de Power Ranger Bot">
    <span class="demo"><i></i> Démo</span>
    <h1>Power Ranger Bot</h1>
    <p class="sub">WhatsApp Pairing</p>
    <section class="panel">
      <form id="pairForm"><label for="phone">Numéro WhatsApp</label><div class="row"><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+225 07 00 00 00 00" required><button id="submitBtn" type="submit">Obtenir le code</button></div></form>
      <div id="result" class="result" role="status" aria-live="polite"></div>
    </section>
    <div class="foot">POWER RANGER BOT · VERSION DÉMO</div>
  </main>
  <script>
    const form=document.getElementById('pairForm'),result=document.getElementById('result'),button=document.getElementById('submitBtn');
    form.addEventListener('submit',async e=>{e.preventDefault();const phone=document.getElementById('phone').value.trim().replace(/[\s().-]/g,'');if(!/^\+?[1-9]\d{7,14}$/.test(phone)){result.className='result show';result.textContent='Vérifie le numéro et son indicatif pays.';return}button.disabled=true;button.textContent='Chargement…';try{const r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||'Le serveur ne peut pas générer le code.');result.className='result show';result.innerHTML='Ton code de pairing :<span class="code"></span>';result.querySelector('.code').textContent=data.code||'Indisponible'}catch(err){result.className='result show';result.textContent=err instanceof TypeError?'Démo visuelle : connecte le backend du bot sur /api/pair pour générer un vrai code.':err.message}finally{button.disabled=false;button.textContent='Obtenir le code'}});
  </script>
</body>
</html>
