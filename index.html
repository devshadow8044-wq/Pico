<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5fbf8">
  <meta name="description" content="Power Ranger Bot — démo de pairing WhatsApp.">
  <title>Power Ranger Bot — Démo</title>
  <style>
    :root{color-scheme:light;--ink:#172720;--muted:#708279;--green:#12a96c;--line:#dcebe3;--paper:#f4faf7;--panel:rgba(255,255,255,.82);--field:#fff;--accent:#12a96c;--accent-soft:rgba(18,169,108,.12);--shadow:rgba(25,69,49,.09);--halo1:rgba(39,222,151,.24);--halo2:rgba(89,150,255,.22)}
    *{box-sizing:border-box}html{min-height:100%;background:var(--paper)}body{margin:0;min-height:100vh;overflow-x:hidden;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .3s,color .3s;position:relative}
    body:before,body:after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(3px);mix-blend-mode:normal}body:before{width:540px;height:540px;top:-205px;left:-190px;background:radial-gradient(circle,var(--halo1),transparent 68%)}body:after{width:610px;height:610px;right:-240px;bottom:-270px;background:radial-gradient(circle,var(--halo2),rgba(195,143,255,.11) 39%,transparent 70%)}
    body[data-theme="dark"]{color-scheme:dark;--ink:#eaf5ef;--muted:#a2b6ab;--line:rgba(189,229,207,.16);--paper:#0c1512;--panel:rgba(17,30,25,.82);--field:#101c17;--shadow:rgba(0,0,0,.35);--halo1:rgba(24,214,133,.18);--halo2:rgba(73,119,255,.19)}
    body[data-color="blue"]{--accent:#3587ed;--accent-soft:rgba(53,135,237,.13);--halo1:rgba(74,168,255,.26);--halo2:rgba(75,111,255,.18)}body[data-color="purple"]{--accent:#945be8;--accent-soft:rgba(148,91,232,.13);--halo1:rgba(183,103,255,.23);--halo2:rgba(117,104,255,.19)}body[data-color="red"]{--accent:#eb5a67;--accent-soft:rgba(235,90,103,.13);--halo1:rgba(255,108,108,.22);--halo2:rgba(255,162,76,.16)}
    .ambient{position:fixed;z-index:0;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 47%,var(--accent-soft),transparent 39%);opacity:.78}.page{min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;padding:22px clamp(16px,4vw,54px) 20px}.topbar{width:min(1120px,100%);margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.palette,.tools{display:flex;align-items:center;gap:9px}.palette{padding:8px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 28px var(--shadow)}.palette-label{font-size:11px;color:var(--muted);font-weight:700;margin-right:2px}.swatch{width:24px;height:24px;border:2px solid var(--panel);border-radius:50%;cursor:pointer;box-shadow:0 0 0 1px var(--line);padding:0}.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}.swatch.green{background:#12a96c}.swatch.blue{background:#3587ed}.swatch.purple{background:#945be8}.swatch.red{background:#eb5a67}.control{height:39px;padding:0 13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);font:700 12px inherit;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:0 8px 25px var(--shadow);transition:transform .18s,border-color .18s}.control:hover{transform:translateY(-1px);border-color:var(--accent)}.control svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.center{width:min(470px,100%);margin:auto;text-align:center;padding:34px 0 48px}.cover{width:min(100%,360px);aspect-ratio:3/2;object-fit:cover;display:block;margin:0 auto 23px;border-radius:26px;box-shadow:0 20px 58px var(--shadow);border:1px solid var(--line)}.demo{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);border:1px solid var(--line);color:var(--accent);border-radius:999px;padding:7px 13px;text-transform:uppercase;letter-spacing:1.7px;font-size:10px;font-weight:850}.demo i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}h1{margin:15px 0 8px;font-size:clamp(32px,8vw,46px);letter-spacing:-1.7px;line-height:1.04;font-weight:850}.sub{margin:0 auto 28px;color:var(--muted);font-size:14px;letter-spacing:.15px}.panel{background:var(--panel);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:21px;text-align:left;box-shadow:0 18px 55px var(--shadow)}label{display:block;margin:0 0 9px 2px;font-size:12px;font-weight:750;color:var(--muted)}.row{display:flex;gap:9px}input{min-width:0;flex:1;height:49px;border:1px solid var(--line);background:var(--field);border-radius:11px;padding:0 13px;color:var(--ink);font:inherit;font-size:14px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.submit{height:49px;padding:0 16px;border:0;border-radius:11px;background:var(--accent);color:white;font:inherit;font-size:13px;font-weight:800;white-space:nowrap;cursor:pointer;box-shadow:0 7px 18px var(--shadow);transition:.18s}.submit:hover{filter:brightness(1.07);transform:translateY(-1px)}.submit:disabled{opacity:.6;cursor:wait}.result{display:none;margin-top:13px;padding:12px 13px;border:1px solid var(--line);background:var(--accent-soft);border-radius:11px;color:var(--muted);font-size:12px;line-height:1.5;overflow-wrap:anywhere}.result.show{display:block}.code{display:block;margin-top:5px;color:var(--accent);font:bold 22px ui-monospace,monospace;letter-spacing:5px}.foot{margin-top:20px;color:var(--muted);opacity:.78;font-size:10px;letter-spacing:1.5px}.bottom{width:min(1120px,100%);margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);opacity:.8;font-size:10px;letter-spacing:.4px}.bottom:before{content:"";height:1px;background:var(--line);position:absolute;left:0;right:0;transform:translateY(-22px)}
    @media(max-width:520px){.page{padding:14px 14px 19px}.topbar{justify-content:center}.palette{order:2}.tools{order:1;width:100%;justify-content:center}.center{padding:34px 0 55px}.cover{width:min(100%,320px);border-radius:22px}.panel{padding:17px}.row{flex-direction:column}.submit{width:100%}.bottom{justify-content:center}.bottom span:first-child{display:none}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body data-theme="light" data-color="green">
  <div class="ambient" aria-hidden="true"></div>
  <div class="page">
    <header class="topbar" aria-label="Réglages du site">
      <div class="palette" role="group" aria-label="Choisir une couleur"><span class="palette-label">Couleur</span><button class="swatch green" type="button" data-pick="green" aria-label="Vert" aria-pressed="true"></button><button class="swatch blue" type="button" data-pick="blue" aria-label="Bleu" aria-pressed="false"></button><button class="swatch purple" type="button" data-pick="purple" aria-label="Violet" aria-pressed="false"></button><button class="swatch red" type="button" data-pick="red" aria-label="Rouge" aria-pressed="false"></button></div>
      <div class="tools">
        <button class="control" id="themeBtn" type="button" aria-label="Activer le mode sombre"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg><span id="themeText">Mode sombre</span></button>
        <button class="control" id="musicBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span id="musicText">Musique : arrêt</span></button>
      </div>
    </header>
    <main class="center">
      <img class="cover" src="power-ranger-cover.png" alt="Illustration futuriste lumineuse de Power Ranger Bot">
      <span class="demo"><i></i> Démo</span>
      <h1>Power Ranger Bot</h1>
      <p class="sub">WhatsApp Pairing</p>
      <section class="panel">
        <form id="pairForm"><label for="phone">Numéro WhatsApp</label><div class="row"><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+225 07 00 00 00 00" required><button class="submit" id="submitBtn" type="submit">Obtenir le code</button></div></form>
        <div id="result" class="result" role="status" aria-live="polite"></div>
      </section>
      <div class="foot">POWER RANGER BOT · VERSION DÉMO</div>
    </main>
    <footer class="bottom"><span>POWER RANGER BOT</span><span>Interface de démonstration</span></footer>
  </div>
  <script>
    const root=document.body;
    const themeBtn=document.getElementById('themeBtn');
    const themeText=document.getElementById('themeText');
    const savedTheme=localStorage.getItem('prb-theme');
    const savedColor=localStorage.getItem('prb-color');
    if(savedTheme==='dark')root.dataset.theme='dark';
    if(['green','blue','purple','red'].includes(savedColor))root.dataset.color=savedColor;
    document.querySelectorAll('[data-pick]').forEach(btn=>{btn.setAttribute('aria-pressed',String(btn.dataset.pick===root.dataset.color));btn.addEventListener('click',()=>{root.dataset.color=btn.dataset.pick;localStorage.setItem('prb-color',btn.dataset.pick);document.querySelectorAll('[data-pick]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));});});
    function syncTheme(){const dark=root.dataset.theme==='dark';themeText.textContent=dark?'Mode clair':'Mode sombre';themeBtn.setAttribute('aria-label',dark?'Activer le mode clair':'Activer le mode sombre');document.querySelector('meta[name="theme-color"]').content=dark?'#0c1512':'#f4faf7'}syncTheme();
    themeBtn.addEventListener('click',()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';localStorage.setItem('prb-theme',root.dataset.theme);syncTheme()});
    let audioCtx=null,oscillators=[],gain=null,musicOn=false;const musicBtn=document.getElementById('musicBtn'),musicText=document.getElementById('musicText');
    function startMusic(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){musicText.textContent='Audio indisponible';return}audioCtx=new AC();gain=audioCtx.createGain();gain.gain.value=.018;gain.connect(audioCtx.destination);[174.61,220,261.63].forEach((freq,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;o.detune.value=(i-1)*4;g.gain.value=[.55,.34,.2][i];o.connect(g);g.connect(gain);o.start();oscillators.push(o)});musicOn=true;musicText.textContent='Musique : marche';musicBtn.setAttribute('aria-pressed','true')}
    function stopMusic(){if(audioCtx){audioCtx.close();audioCtx=null}oscillators=[];musicOn=false;musicText.textContent='Musique : arrêt';musicBtn.setAttribute('aria-pressed','false')}
    musicBtn.addEventListener('click',()=>musicOn?stopMusic():startMusic());
    const form=document.getElementById('pairForm'),result=document.getElementById('result'),submit=document.getElementById('submitBtn');
    form.addEventListener('submit',async e=>{e.preventDefault();const phone=document.getElementById('phone').value.trim().replace(/[\s().-]/g,'');if(!/^\+?[1-9]\d{7,14}$/.test(phone)){result.className='result show';result.textContent='Vérifie le numéro et son indicatif pays.';return}submit.disabled=true;submit.textContent='Chargement…';try{const r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.message||'Le serveur ne peut pas générer le code.');result.className='result show';result.innerHTML='Ton code de pairing :<span class="code"></span>';result.querySelector('.code').textContent=data.code||'Indisponible'}catch(err){result.className='result show';result.textContent=err instanceof TypeError?'Démo visuelle : connecte le backend du bot sur /api/pair pour générer un vrai code.':err.message}finally{submit.disabled=false;submit.textContent='Obtenir le code'}});
  </script>
</body>
</html>
