<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POWER RANGER MD - Générateur Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        rgBg: '#030509',
                        rgCard: '#0d111a',
                        rgBorder: '#1e2638'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #030509; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .rg-glass { background: rgba(13, 17, 26, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .rangers-gradient-text {
            background: linear-gradient(135deg, #ef4444, #f59e0b, #10b981, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-rangers {
            background: linear-gradient(135deg, #dc2626, #f59e0b, #2563eb);
            transition: all 0.3s ease;
        }
        .btn-rangers:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 antialiased">

    <div class="max-w-md w-full space-y-6">
        
        <div class="rg-glass rounded-3xl overflow-hidden shadow-2xl border border-slate-800">
            
            <!-- PHOTO EN HAUT -->
            <div class="h-44 w-full relative">
                <img src="https://files.catbox.moe/9kbqzl.jpg" class="w-full h-full object-cover opacity-90" alt="Power Ranger MD">
                <div class="absolute inset-0 bg-gradient-to-t from-[#0d111a] via-slate-950/30 to-transparent"></div>
                <div class="absolute top-3 right-3 px-3 py-1 rounded-full bg-red-600/90 border border-red-400 text-[10px] font-black text-white uppercase tracking-widest shadow-lg">
                    Systeme Actif
                </div>
            </div>

            <div class="p-6 pt-2 space-y-5 text-center">
                
                <!-- NOM POWER RANGER MD AVEC COULEURS -->
                <div class="space-y-1">
                    <h1 class="text-2xl font-black tracking-wider uppercase rangers-gradient-text">POWER RANGER MD</h1>
                    <p class="text-xs text-slate-400">Plateforme officielle de génération et d'association de session</p>
                </div>

                <!-- FORMULAIRE -->
                <div class="space-y-4 text-left pt-2">
                    <div>
                        <label class="block text-[11px] font-bold uppercase text-slate-400 mb-1">
                            Numero WhatsApp (avec indicatif pays)
                        </label>
                        <div class="flex bg-slate-950 border border-slate-800 rounded-2xl overflow-hidden shadow-inner focus-within:border-amber-500 transition">
                            <span class="px-4 flex items-center text-slate-400 text-xs font-mono border-r border-slate-800 bg-slate-900">+</span>
                            <input type="tel" id="whatsapp-number" class="w-full bg-transparent px-4 py-3.5 text-sm text-white placeholder-slate-600 focus:outline-none" placeholder="221771234567">
                        </div>
                    </div>

                    <!-- BOUTON GENERER LE CODE -->
                    <button onclick="generateCode()" class="w-full py-4 rounded-2xl btn-rangers text-white font-black text-xs uppercase tracking-wider shadow-xl">
                        Generer le code de liaison
                    </button>
                </div>

                <!-- PETITE TEXTE EN BAS -->
                <div class="pt-2 border-t border-slate-800/60">
                    <p class="text-[10px] text-slate-500 leading-relaxed">
                        Entrez votre numero WhatsApp complet sans espaces pour obtenir votre code d'authentification securise via le bot POWER RANGER MD.
                    </p>
                </div>

            </div>
        </div>

    </div>

    <!-- POPUP DE NOTIFICATION -->
    <div id="custom-alert" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md hidden p-4">
        <div class="rg-glass max-w-xs w-full p-6 rounded-3xl text-center space-y-4 border border-slate-700 shadow-2xl">
            <p id="alert-text" class="text-xs text-white font-medium leading-relaxed"></p>
            <button onclick="closeAlert()" class="w-full py-3 rounded-xl btn-rangers text-white font-black text-xs uppercase">Fermer</button>
        </div>
    </div>

    <script>
        function showAlert(msg) {
            document.getElementById('alert-text').innerText = msg;
            document.getElementById('custom-alert').classList.remove('hidden');
        }
        function closeAlert() {
            document.getElementById('custom-alert').classList.add('hidden');
        }

        function generateCode() {
            const phone = document.getElementById('whatsapp-number').value.trim();
            if(!phone || phone.length < 8) {
                showAlert("Veuillez entrer un numero WhatsApp valide pour continuer.");
                return;
            }
            showAlert("Generation du code en cours pour le numero +" + phone + ". Veuillez patienter...");
        }
    </script>
</body>
</html>
