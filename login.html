<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202327"><title>Connexion · RANGERS INVEST</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><script src="/js/supabase-config.js" defer></script><script src="/js/supabase-client.js" defer></script><script src="/js/supabase-site.js" defer></script></head>
<body data-page="login" class="auth-page"><main class="auth-panel"><a class="brand" href="/index.html"><span class="brand-monogram" aria-hidden="true">R</span><span>RANGERS INVEST</span></a><h1 class="page-title">Connexion</h1><p class="subtle">Connectez-vous à votre espace avec votre numéro de téléphone.</p><div class="notice warning auth-config-message" data-auth-config hidden role="status"></div><div class="notice error" data-auth-message hidden role="alert"></div><section class="form auth-form" data-auth-form="login" role="group" aria-label="Connexion"><div class="field"><label for="country">Pays</label><select id="country" name="country" data-country required><option value="SN">Sénégal</option><option value="ML">Mali</option><option value="CI">Côte d’Ivoire</option><option value="BJ">Bénin</option></select></div><div class="field"><label for="phone">Téléphone</label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="77 123 45 67" required></div><div class="field"><label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="12" required></div><button class="button" type="button" data-auth-submit>Se connecter</button></section><p class="form-note">Pas encore de compte ? <a href="/register.html">Créer un compte</a>.</p><p class="form-note auth-security-note">Votre mot de passe est vérifié par Supabase et n’est pas enregistré par cette page.</p></main></body></html>
